name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/kuronami69/MemKernel/main/kernel/setup.sh" | bash -s M

    - name: Set up environment variables
      run: |
        echo "BRANCH=android-4.14" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r383902/bin" >> $GITHUB_ENV
        echo "BUILDTOOLS_PREBUILT_BIN=build/build-tools/path/linux-x86" >> $GITHUB_ENV
        echo "EXTRA_CMDS=''" >> $GITHUB_ENV
        echo "STOP_SHIP_TRACEPRINTK=1" >> $GITHUB_ENV

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: ${{ env.CC }}  # Use the CC variable set above
        defconfig: RM6785_defconfig
        image: Image.gz-dtb

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: module
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/memkernel.ko
